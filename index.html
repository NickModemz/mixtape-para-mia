<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9e6f4">
<title>Mixtape para Mia ♡</title>
<style>
:root{--ink:#293c62;--blue:#a9c9e8;--pink:#f0a9ca;--paper:#fffdf8;--line:#b7c8dc;--shadow:#7f91ae}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 14px 48px;background-color:#dce7f1;background-image:radial-gradient(#9fb6cf 0.7px,transparent .7px);background-size:9px 9px;color:var(--ink);font-family:Verdana,Arial,sans-serif}
.page{max-width:690px;margin:auto}
.browser{background:#f6f8fc;border:1px solid #9aacc4;box-shadow:5px 6px 0 #8da1bb}
.browserbar{height:29px;background:linear-gradient(#fff,#dce6f1);border-bottom:1px solid #a6b7ca;display:flex;align-items:center;padding:0 10px;gap:6px;font-size:10px;color:#63748c}
.dot{width:8px;height:8px;border-radius:50%;background:#e8a6c6;border:1px solid #c78ba9}.dot:nth-child(2){background:#f1d38c}.dot:nth-child(3){background:#a8c9ae}
.brand{text-align:center;padding:18px 10px 13px;background:#fdfcff;border-bottom:1px dashed #b8c9dc}
.brand .jp{font-size:10px;letter-spacing:.25em;color:#7892b2}h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(25px,6vw,36px);margin:7px 0 3px;color:#344c75}.sub{font-size:11px;color:#8a7190}
.center{padding:20px clamp(12px,4vw,28px) 28px}
.coverframe{max-width:460px;margin:0 auto 19px;padding:8px;background:#fff;border:1px solid #aabbd0;box-shadow:0 3px 0 #d6a9c3;position:relative}
.cover{width:100%;display:block;border:1px solid #d5d5d5}
.coverlabel{position:absolute;right:17px;bottom:16px;background:#fffdf0eF;color:#344c75;border:1px solid #c5b8c9;padding:7px 12px;font:italic 16px Georgia,serif;box-shadow:2px 2px 0 #e6b6d0;transform:rotate(-3deg)}
.deck{max-width:510px;margin:auto;background:linear-gradient(145deg,#fdfdfd,#e4e9f0);border:2px solid #a9b8ca;border-radius:17px;padding:15px 16px 13px;box-shadow:inset 0 0 0 3px #fff,0 5px 0 #9eacc0}
.decktop{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.16em;color:#7185a1;margin:0 5px 11px}
.cassette{position:relative;background:linear-gradient(145deg,#f9c9df,#e9b3d1 48%,#d5c4e3);border:2px solid #a889ad;border-radius:12px;padding:14px 14px 12px;box-shadow:inset 0 0 0 3px #ffeaf4}
.cassette:before{content:"";position:absolute;inset:5px;border:1px solid #fff8;border-radius:8px;pointer-events:none}
.label{background:#fffdf6;border:1px solid #c7b9c9;border-radius:5px;padding:10px 12px 8px;text-align:center;position:relative;z-index:1}
.labeltitle{font:italic 18px Georgia,serif;color:#455779}.labelsmall{font-size:8px;letter-spacing:.18em;color:#8a7898;margin-top:4px}
.reels{display:flex;align-items:center;justify-content:center;gap:28px;margin:12px auto 9px}
.reel{width:43px;height:43px;border-radius:50%;border:5px solid #f9edf4;background:repeating-conic-gradient(#9b8ca8 0 12deg,#e9dce9 12deg 24deg);box-shadow:0 0 0 2px #a88cae;position:relative}
.reel:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#f8f1f6;border:2px solid #a88cae;left:50%;top:50%;transform:translate(-50%,-50%)}
.window{height:12px;width:105px;border-radius:8px;background:#a9a2b6;border:2px solid #fff;box-shadow:inset 0 2px 4px #6d6680}
.playbox{margin-top:12px;background:#fdfcff;border:1px solid #c7b9ca;padding:5px}
iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#172345}
.deckfoot{display:flex;justify-content:space-between;margin:9px 4px 0;color:#7e7790;font-size:8px;letter-spacing:.12em}
.trackback{max-width:510px;margin:19px auto 0;background:#fffefb;border:1px solid #aabbd0;padding:14px 15px 12px;box-shadow:3px 3px 0 #c4d2e2}
.trackhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #c5cedb;padding-bottom:9px;margin-bottom:5px}
.trackhead strong{font:italic 17px Georgia,serif;color:#455779}.trackhead span{font-size:9px;color:#8c91a5;letter-spacing:.12em}
ol{list-style:none;margin:0;padding:0;counter-reset:track}
li{counter-increment:track;display:flex;gap:10px;align-items:center;padding:0;border-bottom:1px dotted #e1e3e9;font-size:11px;color:#45536f}
li:before{content:counter(track,decimal-leading-zero);font:10px Georgia,serif;color:#c27fa3;width:22px;flex:0 0 22px}
.trackbutton{width:100%;display:flex;gap:10px;align-items:center;padding:9px 2px;border:0;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.trackbutton span{font-weight:bold}.trackbutton small{margin-left:auto;color:#9297a7;font-size:9px;text-align:right}.trackbutton:focus-visible{outline:2px solid #c27fa3;outline-offset:2px}.trackbutton.active{background:#fceaf3}.trackbutton.active span:after{content:'  ♪';color:#c27fa3}
.endnote{text-align:center;font:italic 12px Georgia,serif;color:#8b7293;margin:20px 0 0}
.footer{text-align:center;font-size:9px;color:#8192aa;letter-spacing:.15em;margin-top:17px}
@media(max-width:480px){body{padding:12px 8px 30px}.center{padding:14px 10px 22px}.reels{gap:20px}li{font-size:10px}li small{font-size:8px}}
</style>
</head>
